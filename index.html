<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png" />
    <link rel="stylesheet" href="styles.css" />
    <title>Pricing Page</title>
  </head>
  <body>
    <main>
      <section class="container">
        <h1 class="page-title">Our Pricing</h1>

        <div class="plan-toggle">
          <span id="annual-label">Annually</span>

          <button
            class="toggle-btn"
            type="button"
            aria-label="Toggle billing period"
            aria-pressed="false"
          >
            <span class="toggle-circle"></span>
          </button>

          <span id="monthly-label" class="active">Monthly</span>
        </div>

        <div class="card-container">
          <div class="card">
            <h2>Basic</h2>

            <div class="price">
              <span class="currency">&dollar;</span>
              <strong id="basic-price">19.99</strong>
            </div>

            <ul class="feature-list">
              <li>500 GB Storage</li>
              <li>2 Users Allowed</li>
              <li>Send up to 3 GB</li>
            </ul>

            <div class="more-btn">
              <button>Learn More</button>
            </div>
          </div>

          <div class="card active-card">
            <h2>Professional</h2>

            <div class="price">
              <span class="currency">&dollar;</span>
              <strong id="professional-price">24.99</strong>
            </div>

            <ul class="feature-list">
              <li>1 TB Storage</li>
              <li>5 Users Allowed</li>
              <li>Send up to 10 GB</li>
            </ul>

            <div class="more-btn">
              <button>Learn More</button>
            </div>
          </div>

          <div class="card">
            <h2>Master</h2>

            <div class="price">
              <span class="currency">&dollar;</span>
              <strong id="master-price">39.99</strong>
            </div>

            <ul class="feature-list">
              <li>2 TB Storage</li>
              <li>10 Users Allowed</li>
              <li>Send up to 20 GB</li>
            </ul>

            <div class="more-btn">
              <button>Learn More</button>
            </div>
          </div>
        </div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
